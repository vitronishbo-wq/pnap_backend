name: Verify agent rules

on:
  push:
  pull_request:

jobs:
  verify-agent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check AGENT_RULES.md exists
        run: test -f AGENT_RULES.md
      - name: Check docs files exist
        run: |
          test -f docs/tree.json
          test -f docs/tree.modules.json
