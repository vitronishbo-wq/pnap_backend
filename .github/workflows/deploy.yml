name: PNAP-AO — Deploy Automático

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pnap-ao-production
  cancel-in-progress: true

jobs:

  # ============================================================
  # BACKEND — RENDER
  # ============================================================
  deploy-render:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "ERRO: RENDER_DEPLOY_HOOK não configurado."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/json" \
            "$RENDER_DEPLOY_HOOK"

          echo "Deploy do Render disparado com sucesso."


  # ============================================================
  # FRONTEND — FIREBASE HOSTING
  # ============================================================
  deploy-firebase:
    name: Build + Deploy Frontend → Firebase Hosting
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Código oficial do GitHub
      # --------------------------------------------------------
      - name: Checkout do código
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------------
      # 3. Corrigir automaticamente o lockfile, se necessário
      #    Evita falhas de npm ci quando o Google AI Studio
      #    alterou package.json mas não atualizou package-lock.json.
      # --------------------------------------------------------
      - name: Sincronizar package-lock.json
        run: |
          set -euo pipefail

          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      # --------------------------------------------------------
      # 4. Instalação limpa e determinística
      # --------------------------------------------------------
      - name: Instalar dependências
        run: |
          set -euo pipefail

          npm ci \
            --no-audit \
            --no-fund

      # --------------------------------------------------------
      # 5. Build Vite
      # --------------------------------------------------------
      - name: Compilar Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

        run: |
          set -euo pipefail

          npm run build:client

          test -f dist/index.html

          echo "Build Vite concluído."
          echo "Artefacto encontrado: dist/index.html"

      # --------------------------------------------------------
      # 6. Deploy REAL para Firebase Hosting
      # --------------------------------------------------------
      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PNAP_AO }}
          projectId: pnap-ao
          channelId: live

      # --------------------------------------------------------
      # 7. Confirmação
      # --------------------------------------------------------
      - name: Confirmar publicação
        run: |
          echo "=============================================="
          echo " PNAP-AO FRONTEND PUBLICADO"
          echo " https://pnap-ao.web.app"
          echo "=============================================="