name: Deploy Automático - PNAP-AO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-render:
    name: Notificar Render (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Hook
        run: |
          curl -fsS -X POST \
            -H "Accept: application/json" \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Confirmado
        run: echo "✅ Backend acionado no Render com sucesso."

  deploy-firebase:
    name: Publicar no Firebase Hosting (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Instalar dependências e compilar
        run: |
          npm ci
          npm run build
      - name: Publicar
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PNAP_AO }}'
          channelId: live
          projectId: pnap-ao
