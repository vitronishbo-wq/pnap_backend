name: Deploy PNAP-AO (Produção)

on:
  push:
    branches:
      - main            # Altere para a sua branch padrão, se necessário
  workflow_dispatch:    # Permite execução manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build do Frontend (Vite) com variáveis de produção
        env:
          # Endpoint principal do backend no Render
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Credenciais Firebase Client-Side
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: npm run build

      # (Opcional) Upload do artefato gerado (pasta dist/) para análise
      - name: Upload dos artefatos (opcional)
        uses: actions/upload-artifact@v4
        with:
          name: pnap-frontend-dist
          path: dist/

      # (Opcional) Disparo do Deploy automático no Render via Webhook
      - name: Deploy automático no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Deploy acionado no Render!"
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK não configurado. Deploy manual necessário."
          fi
